# Server Port: Railway injects PORT; fallback to SERVER_PORT or 8080
server.port=${PORT:${SERVER_PORT:8080}}

# MySQL Database Configuration
# Automatically binds to Railway MySQL environment variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD)
# Also supports MYSQL_DATABASE, DB_URL, or local default fallback
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:busticket}}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:tiger}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security
# Supports both jwt.secret and app.jwt.secret
jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6a8a3d9}}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.secret=${jwt.secret}
app.jwt.expiration-ms=${jwt.expiration}
app.jwt.refresh-expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-btb-system-production.up.railway.app,http://localhost:5173,http://localhost:3000}

# Actuator Health Check for Railway Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
